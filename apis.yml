name: Nuitée (LiteAPI)
kind: company
description: Nuitée is the travel technology company behind LiteAPI, a hotel-booking
  and distribution API platform. LiteAPI exposes a unified REST interface over 2M+
  hotels for static content, real-time rates and availability, the prebook/book/cancel
  reservation flow, loyalty and vouchers, and booking webhooks, with a commission/markup
  revenue model and a free sandbox.
