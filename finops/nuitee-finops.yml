principles:
- name: Visibility
  description: Use the analytics and commission reporting endpoints to track bookings, net cost, and earned commission.
- name: Allocation
  description: Tag API keys and client references per brand/channel; map bookings to internal cost centers.
- name: Optimization
  description: Tune margin/markup per search to balance conversion against earned commission; model net vs. commissionable pricing.
- name: Accountability
  description: Reconcile weekly commission payouts against confirmed (checked-out) bookings; assign owners per channel.
