description: >-
  FinOps view of LiteAPI (Nuitée). Unlike usage-metered API platforms, LiteAPI
  does not bill per API call; instead it operates a commission/markup
  distribution model. Sellers receive net rates and add a margin they keep as
  commission on each completed booking, with commissions paid weekly after
  guest checkout. The "spend" managed here is the cost of hotel inventory
  (net rates) and the margin/commission economics layered on top, rather than
  metered API consumption.
notes: >-
  Commission terms, payout cadence, and any enterprise minimums are
  subject to agreement with Nuitée and should be verified during
  reconciliation.
